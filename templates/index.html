<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>MiniMind</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f5f5f5; }
    h1 { margin-top: 30px; }
    .menu button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .game { display: none; margin-top: 40px; }
    .choices span {
      font-size: 60px;
      margin: 20px;
      cursor: pointer;
    }
    .color-box {
      width: 80px;
      height: 80px;
      display: inline-block;
      margin: 10px;
      cursor: pointer;
    }
    .message { font-size: 28px; margin-top: 20px; }
    .back { margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>

<h1>MiniMind</h1>

<div class="menu">
  <button onclick="showGame('animal')">🐱 Hayvan Oyunu</button>
  <button onclick="showGame('color')">🎨 Renk Oyunu</button>
  <button onclick="showGame('shape')">🔺 Şekil Oyunu</button>
</div>

<!-- HAYVAN -->
<div id="animal" class="game">
  <h2>Kediyi Bul</h2>
  <div class="choices">
    <span onclick="check(true,'animal')">🐱</span>
    <span onclick="check(false,'animal')">🐶</span>
    <span onclick="check(false,'animal')">🚗</span>
  </div>
  <div id="animal-msg" class="message"></div>
  <div class="back" onclick="goHome()">⬅ Geri</div>
</div>

<!-- RENK -->
<div id="color" class="game">
  <h2>Kırmızıyı Bul</h2>
  <div>
    <div class="color-box" style="background:red" onclick="check(true,'color')"></div>
    <div class="color-box" style="background:blue" onclick="check(false,'color')"></div>
    <div class="color-box" style="background:green" onclick="check(false,'color')"></div>
  </div>
  <div id="color-msg" class="message"></div>
  <div class="back" onclick="goHome()">⬅ Geri</div>
</div>

<!-- ŞEKİL -->
<div id="shape" class="game">
  <h2>Üçgeni Bul</h2>
  <div class="choices">
    <span onclick="check(true,'shape')">🔺</span>
    <span onclick="check(false,'shape')">⬛</span>
    <span onclick="check(false,'shape')">⚪</span>
  </div>
  <div id="shape-msg" class="message"></div>
  <div class="back" onclick="goHome()">⬅ Geri</div>
</div>

<script>
function showGame(game) {
  document.querySelector('.menu').style.display = 'none';
  document.getElementById(game).style.display = 'block';
}

function goHome() {
  document.querySelectorAll('.game').forEach(g => g.style.display='none');
  document.querySelector('.menu').style.display = 'block';
}

function check(correct, game) {
  document.getElementById(game + "-msg").innerText =
    correct ? "Aferin! 🎉" : "Tekrar dene";
}
</script>

</body>
</html>
